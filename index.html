<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>TV Colombia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    #player-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: none;
      background: #000;
    }

    #overlay {
      position: absolute;
      bottom: 60px;
      left: 60px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px 40px;
      border-radius: 16px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #overlay.visible {
      opacity: 1;
    }

    .overlay-number {
      font-size: 28px;
      color: #aaa;
      letter-spacing: 1px;
    }

    .overlay-name {
      font-size: 52px;
      color: #fff;
      font-weight: bold;
      margin-top: 4px;
    }

    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 64px;
      height: 64px;
      border: 5px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #fff;
      font-size: 36px;
      margin-top: 30px;
    }

    #error {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      background: #111;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    #error.visible {
      display: flex;
    }

    .error-icon {
      font-size: 72px;
      margin-bottom: 20px;
    }

    .error-message {
      color: #fff;
      font-size: 40px;
    }

    .error-hint {
      color: #888;
      font-size: 26px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <video id="player-video" autoplay></video>

  <div id="overlay">
    <div class="overlay-number"></div>
    <div class="overlay-name"></div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Cargando...</div>
  </div>

  <div id="error">
    <div class="error-icon">&#x26A0;</div>
    <div class="error-message">No se pudo cargar el canal</div>
    <div class="error-hint">Presione &#x25B2; o &#x25BC; para cambiar de canal</div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/channels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
